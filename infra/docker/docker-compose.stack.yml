# ============================================================
# Tiendafy — UN stack de aplicación, dos ambientes.
#
# El mismo archivo levanta producción y staging: lo único que cambia es el
# archivo de variables. Que sean el mismo compose no es prolijidad, es el
# punto: si staging se define aparte, se va pareciendo cada vez menos a
# producción y deja de servir para probar.
#
#   docker compose -f docker-compose.stack.yml --env-file .env.prod    up -d
#   docker compose -f docker-compose.stack.yml --env-file .env.staging up -d
#
# El borde (Caddy, puertos 80/443) NO está acá: vive en infra/edge y es uno
# solo para todo el servidor (Tiendafy y los demás sistemas de la máquina). Por
# eso cada servicio publica su puerto SOLO en 127.0.0.1: el que da la cara es
# Caddy. Los puertos salen del .env de cada ambiente para que prod y staging no
# choquen (y tienen que coincidir con infra/edge/sites/tiendafy.caddy).
#
# Migraciones como paso de deploy, antes del up:
#   docker compose ... --env-file .env.<amb> run --rm api dotnet Api.dll migrate
# ============================================================

x-pg-image: &pgimage postgres:18-alpine

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

# Endurecimiento de los contenedores de la app: sin escalar privilegios, sin
# ninguna capability de Linux (ninguno necesita una: escuchan puertos altos y
# escriben solo en sus volúmenes) y con el sistema de archivos de solo lectura;
# lo que escribe va a un tmpfs o a un volumen declarado. La API y la tienda
# pisan read_only (ver en cada una por qué).
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  # Tope de procesos e hilos: una fuga de hilos o un fork bomb dentro del
  # contenedor no tumba el servidor entero. Muy por arriba de lo que usan (la
  # API y la tienda andan en pocas decenas).
  pids_limit: 512

# Quién lee los backups afuera: el usuario que corre deploy.sh (que exporta
# BACKUP_UID/BACKUP_GID). La carpeta es suya, con 0700, y los archivos son suyos
# con 0600 (pg-backup se los devuelve). backup-offsite corre como él.
x-backup-user: &backupuser
  user: '${BACKUP_UID:-1000}:${BACKUP_GID:-1000}'

services:
  postgres:
    image: *pgimage
    restart: unless-stopped
    <<: *logging
    # Cada ambiente tiene su base y su volumen. Compartir una instancia entre
    # staging y producción ahorra memoria y cuesta caro el día que una
    # migración de staging bloquea una tabla de producción.
    environment:
      POSTGRES_DB: tiendafy
      POSTGRES_USER: tiendafy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en el .env del ambiente}
    volumes:
      # Un volumen por major (pgdata<major>): los datos de una major no arrancan
      # con otra, y desde la 18 la imagen los guarda en /var/lib/postgresql/<major>/docker
      # (por eso el montaje es un nivel arriba). Cambiar de major es un paso
      # aparte, infra/pg-upgrade.sh, y deploy.sh se niega a seguir sin él.
      - pgdata18:/var/lib/postgresql
    mem_limit: ${PG_MEM_LIMIT:-1g}
    # Sin cap_drop ni read_only: el entrypoint de la imagen arranca como root,
    # le da el dueño al directorio de datos y baja a postgres con gosu (setuid
    # directo, no un binario setuid), así que no-new-privileges no lo afecta.
    # Un proceso por conexión: 512 deja lugar de sobra a max_connections.
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiendafy -d tiendafy']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backup diario de la base Y del keyring de DataProtection (retención 14
  # días; ver backup.sh). En staging se puede apagar con BACKUP_REPLICAS=0: sus
  # datos son descartables por definición.
  pg-backup:
    image: *pgimage
    restart: unless-stopped
    <<: [*logging, *hardening]
    # Corre como root a propósito: las claves de /keys son 0600 del usuario de
    # la API y hay que leerlas. Con el mínimo: DAC_OVERRIDE (leerlas y escribir
    # en la carpeta 0700) y CHOWN (devolver cada archivo al usuario del servidor,
    # backup.sh). Nada más.
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
    tmpfs:
      - /tmp
    deploy:
      replicas: ${BACKUP_REPLICAS:-1}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_UID: ${BACKUP_UID:-1000}
      BACKUP_GID: ${BACKUP_GID:-1000}
    volumes:
      - ./backups/${APP_ENV:?definir APP_ENV}:/backups
      - ./backup.sh:/usr/local/bin/tiendafy-backup.sh:ro
      # Solo lectura: el backup nunca escribe en el keyring.
      - dpkeys:/keys:ro
    entrypoint: ['sh', '/usr/local/bin/tiendafy-backup.sh']

  # Copia de los backups FUERA del servidor: si se pierde el disco de la VPS,
  # los backups de al lado se pierden con él. Va cifrada antes de salir
  # (rclone crypt): el dump y el keyring juntos abren todos los secretos, así
  # que nunca viajan ni quedan en claro. Apagado hasta configurarlo
  # (OFFSITE_REPLICAS=1 y las variables OFFSITE_*; ver docs/despliegue.md).
  backup-offsite:
    image: rclone/rclone:1.75
    restart: unless-stopped
    <<: [*logging, *hardening, *backupuser]
    tmpfs:
      - /tmp
    deploy:
      replicas: ${OFFSITE_REPLICAS:-0}
    mem_limit: 128m
    environment:
      HOME: /tmp
      RCLONE_CONFIG_DESTINO_TYPE: s3
      RCLONE_CONFIG_DESTINO_PROVIDER: ${OFFSITE_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_DESTINO_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_DESTINO_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY:-}
      RCLONE_CONFIG_DESTINO_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_KEY:-}
      RCLONE_CONFIG_DESTINO_NO_CHECK_BUCKET: 'true'
      RCLONE_CONFIG_CIFRADO_TYPE: crypt
      RCLONE_CONFIG_CIFRADO_REMOTE: destino:${OFFSITE_BUCKET:-tiendafy-backups}/${APP_ENV}
      # La salida de `rclone obscure`, no la frase en claro. Perder la frase =
      # perder la copia: va al gestor de contraseñas, no solo a este archivo.
      RCLONE_CONFIG_CIFRADO_PASSWORD: ${OFFSITE_CRYPT_PASSWORD:-}
    volumes:
      - ./backups/${APP_ENV}:/backups:ro
    # Cada 6 h sube lo nuevo (copy: nunca borra allá lo que se borró acá) y
    # poda lo de más de 60 días.
    entrypoint: >
      sh -c 'while true; do
        rclone copy /backups cifrado: --include "tiendafy-*.dump" --include "dpkeys-*.tgz" --log-level NOTICE;
        rclone delete cifrado: --min-age 60d --log-level NOTICE;
        sleep 21600;
      done'

  api:
    image: ${REGISTRY:-ghcr.io/OWNER/tiendafy}-api:${TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    <<: [*logging, *hardening]
    # La API NO va de solo lectura y su /tmp es el disco del contenedor, no un
    # tmpfs: la importación de fotos extrae el ZIP en /tmp (hasta 2 GB
    # descomprimidos), Kestrel guarda ahí cada archivo de un multipart de más
    # de 64 KB (hasta 1 GB), y QuestPDF/Skia escriben caché de fuentes. Un
    # tmpfs vive en la memoria del contenedor y cuenta para mem_limit: una
    # subida grande y legítima mataría la API por OOM y todas las tiendas se
    # quedarían sin checkout mientras reinicia. Sin privilegios ni
    # capabilities sí, como las demás.
    read_only: false
    mem_limit: ${API_MEM_LIMIT:-1g}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-5080}:5080'
    environment:
      # Production también en staging: staging tiene que comportarse como
      # producción (fail-fast de config, cookies Secure, sin seeds de dev).
      # Lo que lo distingue es a qué servicios apunta, no cómo se comporta.
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5080
      # Lo que llega por el puerto publicado entra desde la red de Docker (rangos
      # privados), y Caddy manda la IP real del visitante en X-Forwarded-For.
      # Sin confiar en esos rangos, todo el tráfico parece venir de un solo lugar
      # y los límites por IP —10 logins cada 5 minutos, el techo global— se
      # comparten entre TODOS los usuarios de la plataforma.
      ForwardedHeaders__KnownNetworks__0: ${TRUSTED_PROXY_CIDR_0:-172.16.0.0/12}
      ForwardedHeaders__KnownNetworks__1: ${TRUSTED_PROXY_CIDR_1:-192.168.0.0/16}
      ForwardedHeaders__KnownNetworks__2: ${TRUSTED_PROXY_CIDR_2:-10.0.0.0/8}
      # Minimum Pool Size: conexiones abiertas aunque no haya tráfico. Sin esto,
      # la primera ráfaga después de un rato ocioso paga abrir cada conexión
      # (cientos de ms cada una) y el p95 de ese momento se dispara.
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=tiendafy;Username=tiendafy;Password=${POSTGRES_PASSWORD};Minimum Pool Size=${DB_MIN_POOL_SIZE:-5}
      # DataProtection: SIN esta ruta la API no arranca (fail-fast). El volumen
      # 'dpkeys' es CRÍTICO: si se pierde, se pierden todos los secretos
      # cifrados (certificados ARCA, tokens MP). Backupear junto a la DB.
      DataProtection__KeyPath: /keys
      Tenancy__PlatformBaseDomain: ${STACK_DOMAIN:?definir en el .env del ambiente}
      Email__From: ${EMAIL_FROM:-}
      # Sin API key los emails se escriben en el log en vez de enviarse. Es el
      # default de staging a propósito: nadie le manda un mail a un cliente
      # real desde un ambiente de prueba.
      Email__ResendApiKey: ${RESEND_API_KEY:-}
      Email__WebhookSecret: ${EMAIL_WEBHOOK_SECRET:-}
      MercadoPago__ClientId: ${MP_CLIENT_ID:-}
      MercadoPago__ClientSecret: ${MP_CLIENT_SECRET:-}
      MercadoPago__WebhookSecret: ${MP_WEBHOOK_SECRET:-}
      MercadoPago__PublicApiBaseUrl: https://api.${STACK_DOMAIN}
      MercadoPago__RedirectUri: https://api.${STACK_DOMAIN}/api/v1/payments/mercadopago/callback
      MercadoPago__AdminReturnUrl: https://admin.${STACK_DOMAIN}/configuracion/medios-de-pago
      PublicApiBaseUrl: https://api.${STACK_DOMAIN}
      # Link al panel en el aviso de stock bajo (sin esto el mail sale sin link).
      Admin__BaseUrl: https://admin.${STACK_DOMAIN}
      # Opcionales: vacías, sin captcha y sin "Entrar con Google" (como hasta ahora).
      Captcha__Turnstile__SiteKey: ${TURNSTILE_SITE_KEY:-}
      Captcha__Turnstile__Secret: ${TURNSTILE_SECRET:-}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      # Canal Mercado Libre (app de la plataforma). Vacío = canal apagado.
      MercadoLibre__ClientId: ${MELI_CLIENT_ID:-}
      MercadoLibre__ClientSecret: ${MELI_CLIENT_SECRET:-}
      MercadoLibre__RedirectUri: https://api.${STACK_DOMAIN}/api/v1/meli/oauth/callback
      MercadoLibre__AdminReturnUrl: https://admin.${STACK_DOMAIN}/configuracion/mercadolibre
      MetaAds__AppId: ${META_APP_ID:-}
      MetaAds__AppSecret: ${META_APP_SECRET:-}
      MetaAds__RedirectUri: https://api.${STACK_DOMAIN}/api/v1/meta-ads/oauth/callback
      MetaAds__AdminReturnUrl: https://admin.${STACK_DOMAIN}/estadisticas/rentabilidad
      Social__Meta__AppId: ${SOCIAL_META_APP_ID:-}
      Social__Meta__AppSecret: ${SOCIAL_META_APP_SECRET:-}
      Social__Meta__RedirectUri: https://api.${STACK_DOMAIN}/api/v1/social/oauth/callback/meta
      Social__X__ClientId: ${SOCIAL_X_CLIENT_ID:-}
      Social__X__ClientSecret: ${SOCIAL_X_CLIENT_SECRET:-}
      Social__X__RedirectUri: https://api.${STACK_DOMAIN}/api/v1/social/oauth/callback/x
      Social__AdminReturnUrl: https://admin.${STACK_DOMAIN}/redes
      # Imágenes: cada ambiente con su bucket. Compartirlo significa que un
      # borrado de prueba se lleva puesta una foto de producción.
      Media__Endpoint: ${MEDIA_ENDPOINT:?definir en el .env del ambiente}
      Media__PublicBaseUrl: ${MEDIA_PUBLIC_BASE_URL:?definir en el .env del ambiente}
      Media__AccessKey: ${MEDIA_ACCESS_KEY:?definir en el .env del ambiente}
      Media__SecretKey: ${MEDIA_SECRET_KEY:?definir en el .env del ambiente}
      Media__Bucket: ${MEDIA_BUCKET:-tiendafy-media}
      Media__PrivateBucket: ${MEDIA_PRIVATE_BUCKET:-tiendafy-private}
      Media__Region: ${MEDIA_REGION:-auto}
      Media__BucketInPublicUrl: ${MEDIA_BUCKET_IN_PUBLIC_URL:-false}
      Media__EnsureBucketOnStartup: ${MEDIA_ENSURE_BUCKET:-false}
      # Aviso al storefront (por la red interna, con el nombre del servicio)
      # para que un diseño publicado o un cambio de catálogo se vea al toque.
      # Sin secreto queda apagado y la tienda vence su caché sola (30 a 60 s).
      Storefront__RevalidateUrl: http://storefront:3000/internal/revalidate
      Storefront__RevalidateSecret: ${REVALIDATE_SECRET:-}
      Sentry__Dsn: ${SENTRY_DSN_BACKEND:-}
      Sentry__Environment: ${APP_ENV}
      Workers__Enabled: ${WORKERS_ENABLED:-true}
      # Palanca de emergencia: apaga la IA de todas las tiendas (ver docs/integraciones/ia.md).
      Ai__Disabled: ${AI_DISABLED:-false}
      # Migraciones como PASO DE DEPLOY, no al boot.
      Database__MigrateOnStartup: 'false'
    volumes:
      - dpkeys:/keys

  storefront:
    image: ${REGISTRY:-ghcr.io/OWNER/tiendafy}-storefront:${TAG:-latest}
    build:
      context: ../..
      dockerfile: storefront/Dockerfile
    restart: unless-stopped
    <<: [*logging, *hardening]
    # La tienda NO va de solo lectura: Next escribe su caché (Data Cache,
    # prerender y las imágenes optimizadas) en .next/cache en runtime, y crece
    # con el catálogo. En un tmpfs viviría en la memoria del contenedor (cuenta
    # para mem_limit) y con tope; en el disco del contenedor, como siempre, se
    # vacía igual en cada deploy (contenedor nuevo). Sin privilegios ni
    # capabilities sí, como las demás.
    read_only: false
    tmpfs:
      - /tmp
    mem_limit: ${WEB_MEM_LIMIT:-768m}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV}
      # Server-side: la API por la red interna, sin salir a internet.
      API_URL: http://api:5080
      PLATFORM_BASE_DOMAIN: ${STACK_DOMAIN}
      # Qué tienda atiende el dominio pelado (${STACK_DOMAIN} a secas). Sin
      # esto, la dirección más visitada contesta "tienda no encontrada".
      PRIMARY_STORE_SUBDOMAIN: ${PRIMARY_STORE_SUBDOMAIN:-}
      # Config que el servidor le pasa al navegador en cada request. Sin el
      # prefijo NEXT_PUBLIC_ a propósito: esas Next las hornea al compilar y
      # entonces la imagen tendría ambiente propio (ver storefront/src/lib/runtime.ts).
      PUBLIC_API_URL: https://api.${STACK_DOMAIN}
      PUBLIC_ADMIN_ORIGIN: https://admin.${STACK_DOMAIN}
      PUBLIC_SENTRY_DSN: ${SENTRY_DSN_STOREFRONT:-}
      # El mismo que Storefront__RevalidateSecret de la API (ver arriba).
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}

  admin:
    image: ${REGISTRY:-ghcr.io/OWNER/tiendafy}-admin:${TAG:-latest}
    build:
      context: ../..
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    <<: [*logging, *hardening]
    # nginx guarda su pid y sus temporales en /tmp; docker-config.sh escribe
    # ahí config.js y la CSP de runtime (ver admin/nginx.conf).
    tmpfs:
      - /tmp
    mem_limit: ${ADMIN_MEM_LIMIT:-128m}
    ports:
      - '127.0.0.1:${ADMIN_PORT:-8090}:8080'
    environment:
      # El contenedor escribe config.js al arrancar con estos valores: la misma
      # imagen sirve para staging y para producción (ver admin/docker-config.sh).
      APP_ENV: ${APP_ENV}
      VITE_API_URL: https://api.${STACK_DOMAIN}
      VITE_STOREFRONT_ORIGIN: https://{sub}.${STACK_DOMAIN}
      # La misma que la de la tienda: su dirección pública es el dominio a secas.
      VITE_PRIMARY_STORE_SUBDOMAIN: ${PRIMARY_STORE_SUBDOMAIN:-}
      VITE_SENTRY_DSN: ${SENTRY_DSN_ADMIN:-}
      # Marca de ESTA instalación (el panel). Vacío = Tiendafy.
      VITE_BRAND_NAME: ${BRAND_NAME:-}

volumes:
  # El volumen de la 16 (pgdata) ya no se declara a propósito: queda en el disco
  # como vuelta atrás de la migración y ningún `down -v` se lo lleva.
  pgdata18:
  dpkeys:
