# Construye UNA vez y promueve: las mismas imágenes que se prueban en staging
# son las que salen a producción.
#
#   push a main → build (tag sha-XXXX) → deploy a staging → smoke →
#   → aprobación manual (GitHub Environment "production") → deploy a producción
#
# Staging es opcional: corre solo si el repo tiene la variable STAGING_DOMAIN.
# Sin ella, del build se pasa directo a producción (con la misma aprobación).
# Producción, igual: sin la variable PLATFORM_DOMAIN (servidor todavía sin
# preparar) el workflow solo construye y publica las imágenes.
#
# La aprobación no se configura acá sino en el repo: Settings → Environments →
# production → Required reviewers. Sin eso, el job de producción sale solo.
name: docker-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Solo el build publica imágenes: los deploys por SSH no necesitan escribir
# en el registro.
permissions:
  contents: read

# Nunca dos releases del mismo ref a la vez (un :latest viejo pisando al nuevo,
# dos deploy.sh contra el servidor) y nunca cancelar uno a mitad de camino.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Los 3 Dockerfiles usan la RAÍZ del repo como contexto (cada uno con su
          # Dockerfile.dockerignore que recorta lo que no necesita).
          - name: api
            context: .
            dockerfile: ./backend/Dockerfile
          - name: storefront
            context: .
            dockerfile: ./storefront/Dockerfile
          - name: admin
            context: .
            dockerfile: ./admin/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/tiendafy-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # SIN URLs de ambiente en los build-args: la config entra al arrancar
          # el contenedor (admin/docker-config.sh y storefront/src/lib/runtime.ts).
          # Es lo que hace que una imagen probada en staging pueda promoverse
          # tal cual a producción en vez de recompilarse.
          build-args: |
            GIT_SHA=${{ github.sha }}

  # ---- Staging: automático en cada push a main ----------------------------
  deploy-staging:
    needs: build-push
    if: github.ref == 'refs/heads/main' && vars.STAGING_DOMAIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN }}
    steps:
      - name: Deploy por SSH
        # Fijada por commit: es de terceros y recibe la clave SSH del servidor.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ vars.DEPLOY_PATH }}
            git fetch --quiet origin main
            git checkout --quiet ${{ github.sha }}
            ./infra/deploy.sh staging "sha-$(printf '%.7s' '${{ github.sha }}')"

  # ---- Humo: si esto falla, producción ni se ofrece -----------------------
  smoke-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: La API responde
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://api.${{ vars.STAGING_DOMAIN }}/health
      - name: La tienda responde
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 -o /dev/null https://${{ vars.STAGING_DOMAIN }}/
      - name: El panel responde
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 -o /dev/null https://admin.${{ vars.STAGING_DOMAIN }}/

  # ---- Producción: el MISMO tag, con aprobación humana --------------------
  # Con staging: después de su humo. Sin staging (saltado a propósito): después
  # del build. Si staging falló, NO sigue.
  deploy-production:
    needs: [build-push, deploy-staging, smoke-staging]
    if: >-
      always() && github.ref == 'refs/heads/main' && vars.PLATFORM_DOMAIN != '' &&
      needs.build-push.result == 'success' &&
      (needs.smoke-staging.result == 'success' ||
       (needs.deploy-staging.result == 'skipped' && needs.smoke-staging.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.PLATFORM_DOMAIN }}
    steps:
      - name: Deploy por SSH
        # Fijada por commit: es de terceros y recibe la clave SSH del servidor.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ vars.DEPLOY_PATH }}
            git fetch --quiet origin main
            git checkout --quiet ${{ github.sha }}
            ./infra/deploy.sh prod "sha-$(printf '%.7s' '${{ github.sha }}')"

      - name: La API de producción responde
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://api.${{ vars.PLATFORM_DOMAIN }}/health
