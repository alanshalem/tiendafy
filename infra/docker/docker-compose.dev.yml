name: tiendafy

services:
  postgres:
    # Misma major que prod y CI (paridad dev/prod).
    image: postgres:18-alpine
    container_name: tiendafy-postgres
    environment:
      POSTGRES_USER: tiendafy
      POSTGRES_PASSWORD: tiendafy
      POSTGRES_DB: tiendafy
    ports:
      # Bind solo a loopback: la DB no queda expuesta a la red si el host no es local.
      - '127.0.0.1:5432:5432'
    volumes:
      # Desde la 18 la imagen guarda los datos en /var/lib/postgresql/<major>/docker
      # y el volumen se monta un nivel arriba. Volumen nuevo por major: el de la
      # 16 (tiendafy_postgres_data) no sirve para la 18. Pasar los datos:
      # docs/DEPLOY.md → "Cambiar de major de Postgres" → Desarrollo.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiendafy']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis, RabbitMQ y PgBouncer se removieron: el sistema usa polling a
  # Postgres (webhook inbox, workers) y la API conecta directo al 5432 —
  # ningún código los consumía. PgBouncer queda reservado en el ADR 0003
  # para RLS/multi-réplica; si hace falta, volver a sumarlo acá y a los docs.

  minio:
    image: minio/minio:latest
    container_name: tiendafy-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:9000:9000' # S3 API
      - '127.0.0.1:9001:9001' # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # Gestor visual de la base. Viene CON el proyecto: se levanta junto al resto,
  # sin login, con el servidor ya cargado y conectando solo (ver pgadmin/).
  #
  #   http://localhost:8081
  #
  # Cuesta ~260 MB de RAM. Si en algún momento estorba, agregarle
  # `profiles: ['tools']` y pasa a prenderse solo cuando se lo pide.
  pgadmin:
    build: ./pgadmin
    image: tiendafy-pgadmin:dev
    container_name: tiendafy-pgadmin
    environment:
      # pgAdmin VALIDA el dominio del email y se niega a arrancar con uno
      # reservado: con @tiendafy.local muere en el arranque con un mensaje que
      # ni menciona el dominio. Tiene que parecer un dominio real.
      PGADMIN_DEFAULT_EMAIL: dev@tiendafy.com.ar
      PGADMIN_DEFAULT_PASSWORD: tiendafy
      # Modo escritorio: entra directo, sin pantalla de login ni clave maestra.
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '127.0.0.1:8081:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

# Nota: sin dnsmasq — *.localhost resuelve a 127.0.0.1 nativamente en
# browsers modernos y Windows 11. mitienda.localhost:3000 funciona directo.

volumes:
  postgres18_data:
  minio_data:
  pgadmin_data:
