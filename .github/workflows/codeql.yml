# Análisis estático de seguridad (CodeQL) — JS/TS y C#.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1' # lunes 7:30 UTC — barrido semanal con queries nuevas

permissions:
  contents: read
  security-events: write
  actions: read # analyze consulta el workflow run al subir el SARIF

# Un push nuevo al mismo PR deja sin sentido la corrida anterior. En main cada
# commit tiene su propio grupo (el sha): ninguno se cancela ni queda en espera.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    # Dependabot corre con token read-only: no puede subir resultados de
    # seguridad. Sus PRs se saltean (el análisis real corre al mergear a main).
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: csharp
            build-mode: autobuild
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # El repo es público: code scanning es gratis y los hallazgos se suben
      # a la pestaña Security (con historial, se cierran solos al arreglarse).
      # Además se guarda el SARIF para evaluarlo acá abajo: los `error` rompen
      # el build. Ojo: con el "default setup" de code scanning prendido en la
      # configuración del repo, esta subida choca con la suya; es uno o el otro.
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          output: sarif-results
      # Política: los hallazgos de nivel `error` ROMPEN el build; los `warning`
      # (heurísticos, con falsos positivos) se anotan en el run y en el SARIF
      # del artifact, sin bloquear. Revisarlos al tocar el archivo señalado.
      - name: Evaluar hallazgos del SARIF
        shell: python
        run: |
          import glob, json, sys
          errors, warnings = [], []
          for f in glob.glob('sarif-results/*.sarif'):
              sarif = json.load(open(f, encoding='utf-8'))
              for run in sarif.get('runs', []):
                  rules = {r['id']: r for r in run.get('tool', {}).get('driver', {}).get('rules', [])}
                  for res in run.get('results', []):
                      rule = rules.get(res.get('ruleId'), {})
                      sev = rule.get('defaultConfiguration', {}).get('level', res.get('level', 'warning'))
                      loc = res.get('locations', [{}])[0].get('physicalLocation', {})
                      art = loc.get('artifactLocation', {}).get('uri', '?')
                      line = loc.get('region', {}).get('startLine', '?')
                      msg = f"{res.get('ruleId')} en {art}:{line}: {res.get('message', {}).get('text', '')[:160]}"
                      (errors if sev == 'error' else warnings).append(msg)
          for w in warnings:
              print(f'::warning::CodeQL: {w}')
          if errors:
              print(f'{len(errors)} hallazgo(s) BLOQUEANTES de CodeQL:')
              print('\n'.join(errors))
              sys.exit(1)
          print(f'CodeQL OK: 0 errores, {len(warnings)} warning(s) anotados.')
      - name: Guardar SARIF como artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 30
