# ============================================================
# Tiendafy — PRODUCCIÓN (single-host con Docker Compose + Caddy)
#
#   cp infra/docker/.env.prod.example infra/docker/.env.prod   (y completar)
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env.prod up -d
#
# Caddy termina TLS (Let's Encrypt automático, incluidos dominios propios de
# merchants vía on-demand TLS) y enruta por host hacia api/admin/storefront.
# Postgres NO expone puerto al exterior. Backups: servicio pg-backup (diario).
# ============================================================

name: tiendafy-prod

# Logs con tope: sin esto, json-file crece sin límite y llena el disco del VPS.
# Una sola fuente para la versión de Postgres: si el server sube de major y el
# backup queda atrás, pg_dump falla por "server version mismatch" EN SILENCIO.
x-pg-image: &pgimage postgres:16-alpine

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  postgres:
    image: *pgimage
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_DB: tiendafy
      POSTGRES_USER: tiendafy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiendafy -d tiendafy']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backup diario de Postgres (pg_dump comprimido, retención 14 días).
  pg-backup:
    image: *pgimage
    restart: unless-stopped
    <<: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h postgres -U tiendafy -d tiendafy -Fc -f "/backups/tiendafy-$$(date +%Y%m%d-%H%M).dump" &&
        find /backups -name "tiendafy-*.dump" -mtime +14 -delete;
        sleep 86400;
      done'

  api:
    image: ${REGISTRY:-ghcr.io/OWNER/tiendafy}-api:${TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    <<: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=tiendafy;Username=tiendafy;Password=${POSTGRES_PASSWORD}
      # DataProtection: SIN esta ruta la API no arranca en Production (fail-fast).
      # El volumen 'dpkeys' es CRÍTICO: si se pierde, se pierden todos los
      # secretos cifrados (certificados ARCA, tokens MP). Backupear junto a la DB.
      DataProtection__KeyPath: /keys
      Tenancy__PlatformBaseDomain: ${PLATFORM_DOMAIN:?definir en .env.prod}
      Email__From: ${EMAIL_FROM}
      Email__ResendApiKey: ${RESEND_API_KEY}
      MercadoPago__ClientId: ${MP_CLIENT_ID}
      MercadoPago__ClientSecret: ${MP_CLIENT_SECRET}
      # Firma de webhooks de MP (panel de la app) — sin esto no se validan.
      MercadoPago__WebhookSecret: ${MP_WEBHOOK_SECRET:-}
      # URL pública de la API: notification_url de MP y links de tracking/baja
      # de los emails de campañas (sin la clave raíz caerían a localhost:5080).
      MercadoPago__PublicApiBaseUrl: https://api.${PLATFORM_DOMAIN}
      PublicApiBaseUrl: https://api.${PLATFORM_DOMAIN}
      # Firma de webhooks de Resend (bounces/quejas de campañas).
      Email__WebhookSecret: ${EMAIL_WEBHOOK_SECRET:-}
      # Meta Ads (ROAS real). Vacío = integración apagada.
      MetaAds__AppId: ${META_APP_ID:-}
      MetaAds__AppSecret: ${META_APP_SECRET:-}
      MetaAds__RedirectUri: https://api.${PLATFORM_DOMAIN}/api/v1/meta-ads/oauth/callback
      MetaAds__AdminReturnUrl: https://admin.${PLATFORM_DOMAIN}/estadisticas/rentabilidad
      # Redes sociales (posts multi-red). Vacío = conector apagado; Telegram
      # no necesita credenciales de plataforma. La app de Meta puede ser la
      # misma de Meta Ads sumando los scopes de páginas/Instagram.
      Social__Meta__AppId: ${SOCIAL_META_APP_ID:-}
      Social__Meta__AppSecret: ${SOCIAL_META_APP_SECRET:-}
      Social__Meta__RedirectUri: https://api.${PLATFORM_DOMAIN}/api/v1/social/oauth/callback/meta
      Social__X__ClientId: ${SOCIAL_X_CLIENT_ID:-}
      Social__X__ClientSecret: ${SOCIAL_X_CLIENT_SECRET:-}
      Social__X__RedirectUri: https://api.${PLATFORM_DOMAIN}/api/v1/social/oauth/callback/x
      Social__AdminReturnUrl: https://admin.${PLATFORM_DOMAIN}/redes
      # Sugerencias con IA (Claude API). Vacío = apagado.
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__Model: ${AI_MODEL:-claude-sonnet-5}
      Sentry__Dsn: ${SENTRY_DSN_BACKEND:-}
      # Segunda réplica de la API: setear Workers__Enabled=false para no duplicar
      # los background workers (webhooks/facturación/carritos corren en UNA sola).
      Workers__Enabled: ${WORKERS_ENABLED:-true}
      # Migraciones como PASO DE DEPLOY, no al boot (evita carreras entre réplicas):
      #   docker compose ... run --rm api dotnet Api.dll migrate
      Database__MigrateOnStartup: 'false'
    volumes:
      - dpkeys:/keys

  storefront:
    image: ${REGISTRY:-ghcr.io/OWNER/tiendafy}-storefront:${TAG:-latest}
    build:
      context: ../..
      dockerfile: storefront/Dockerfile
      args:
        # NEXT_PUBLIC_* va en BUILD (se inlinea en el bundle del browser).
        NEXT_PUBLIC_API_URL: https://api.${PLATFORM_DOMAIN}
        NEXT_PUBLIC_ADMIN_ORIGIN: https://admin.${PLATFORM_DOMAIN}
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_STOREFRONT:-}
    restart: unless-stopped
    <<: *logging
    environment:
      NODE_ENV: production
      API_URL: http://api:5080
      PLATFORM_BASE_DOMAIN: ${PLATFORM_DOMAIN}
      # También en runtime para el Sentry del lado servidor (instrumentation.ts).
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_STOREFRONT:-}

  admin:
    image: ${REGISTRY:-ghcr.io/OWNER/tiendafy}-admin:${TAG:-latest}
    build:
      context: ../..
      dockerfile: admin/Dockerfile
      args:
        VITE_API_URL: https://api.${PLATFORM_DOMAIN}
        VITE_SENTRY_DSN: ${SENTRY_DSN_ADMIN:-}
        # "Ver mi tienda" y el preview del editor ({sub} = subdominio de la tienda).
        VITE_STOREFRONT_ORIGIN: https://{sub}.${PLATFORM_DOMAIN}
    restart: unless-stopped
    <<: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    <<: *logging
    ports:
      - '80:80'
      - '443:443'
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?definir en .env.prod}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - admin
      - storefront

volumes:
  pgdata:
  dpkeys:
  caddydata:
  caddyconfig:
