name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      # Reglas de estilo C# que aplica `dotnet format --verify-no-changes`.
      - '.editorconfig'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      # Reglas de estilo C# que aplica `dotnet format --verify-no-changes`.
      - '.editorconfig'
      - '.github/workflows/backend-ci.yml'

  # A mano desde Actions, para re-verificar main sin tener que tocar código.
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo al mismo PR deja sin sentido la corrida anterior. En main cada
# commit tiene su propio grupo (el sha): ninguno se cancela ni queda en espera.
concurrency:
  group: backend-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    # Postgres para los tests de integración (aislamiento multi-tenant).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tiendafy
          POSTGRES_PASSWORD: tiendafy
          POSTGRES_DB: tiendafy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tiendafy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend.slnx

      - name: Build (warnings as errors)
        run: dotnet build backend.slnx --no-restore --configuration Release -warnaserror

      - name: Format check (dotnet format)
        run: dotnet format backend.slnx --no-restore --verify-no-changes

      # Separados: la cobertura del ratchet se mide SOLO sobre los unit tests.
      # Mezclar los XML de unit + integración duplica el denominador (misma
      # línea contada dos veces, una sin hits) y hunde el porcentaje.
      - name: Tests unitarios (con cobertura)
        run: dotnet test tests/UnitTests --no-build --configuration Release --logger "trx" --collect:"XPlat Code Coverage" --results-directory ./test-results/unit

      - name: Tests de integración (flujos, contratos, smoke de la API, performance)
        run: dotnet test tests/IntegrationTests --no-build --configuration Release --logger "trx" --collect:"XPlat Code Coverage" --results-directory ./test-results/integration

      # Ratchet de cobertura del DOMINIO (asambleas *.Core + SharedKernel):
      # piso 60 (medido local: 71.5% en unit) — al subir la cobertura, subir
      # el piso. Nunca bajarlo.
      - name: Cobertura de dominio >= 60%
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET, sys, re
          lf = lh = 0
          for f in glob.glob('test-results/unit/**/coverage.cobertura.xml', recursive=True):
              for p in ET.parse(f).getroot().iter('package'):
                  if re.search(r'(\.Core|SharedKernel)$', p.get('name', '')):
                      for line in p.iter('line'):
                          lf += 1
                          if int(line.get('hits', '0')) > 0: lh += 1
          pct = lh * 100 / lf if lf else 0
          print(f'Dominio (Core+SharedKernel): {pct:.1f}% ({lh}/{lf} lineas)')
          sys.exit(0 if pct >= 60 else 1)

      # Ratchet de cobertura TOTAL (unit + integración unidos por archivo y
      # línea con tools/coverage.py, que no cuenta dos veces la misma línea):
      # piso 93. Al subir la cobertura, subir el piso.
      - name: Cobertura total >= 93%
        run: python tools/coverage.py test-results --min 93 --top 15

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: backend/test-results
          retention-days: 7
