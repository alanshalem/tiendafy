# Va en /etc/nginx/conf.d/detras-de-caddy.conf (nivel http: vale para todos los sitios).
#
# nginx ya no da la cara a internet: delante está el Caddy del borde (infra/edge),
# que es el único que le habla, siempre desde el propio servidor.

# La IP real del visitante viene en X-Forwarded-For. Sin esto, para nginx todos
# los pedidos vendrían de 127.0.0.1 y los límites por IP (login, captcha, API)
# se compartirían entre TODOS los visitantes: uno solo los agotaría para el resto.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Forwarded-For;

# El esquema con el que entró el visitante (https) también lo dice Caddy. Las
# aplicaciones lo usan para armar links y cookies seguras: con $scheme verían
# "http", que es como les habla Caddy por dentro.
map $http_x_forwarded_proto $proxied_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
