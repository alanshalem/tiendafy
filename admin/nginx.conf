server {
  listen 8080;          # nginx-unprivileged (no-root) usa 8080
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión: el bundle JS/CSS del admin baja ~70% en la primera carga.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  # Delante hay un proxy (Caddy) que agrega "Via": por defecto nginx NO
  # comprime pedidos que vienen de un proxy (gzip_proxied off) y producción
  # servía el JS crudo. Comprimir siempre: la respuesta ya lleva Vary.
  gzip_proxied any;

  # SPA: cualquier ruta cae a index.html (React Router resuelve del lado cliente).
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  # index.html (también el de cada ruta del SPA) se revalida siempre: es el
  # que apunta a los assets con hash del deploy. Sin esto el navegador podía
  # quedarse con el del deploy anterior y pedir chunks que ya no existen.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # La config de runtime NO se cachea: es lo único que cambia entre ambientes
  # y un navegador con la copia vieja seguiría pegándole a la API equivocada.
  location = /config.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    # Lo escribe docker-config.sh al arrancar, en /tmp: el sitio es de solo lectura.
    alias /tmp/tiendafy/config.js;
  }

  # Assets con hash: cache largo. Vienen comprimidos desde el build (.gz al
  # lado de cada uno, ver Dockerfile): se sirven sin comprimir en cada pedido.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    gzip_static on;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
