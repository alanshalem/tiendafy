# Escaneo de secretos en cada push/PR: una API key commiteada se detecta al toque.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # la action enumera los commits del PR vía API

jobs:
  scan:
    # PRs de Dependabot: token read-only sin acceso a la API de PRs (la action
    # crashea) y sus commits no traen secretos. Se escanean igual al mergear.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historial completo: escanea también commits viejos
      # Fijada por commit: es de terceros y recibe el GITHUB_TOKEN. Dependabot
      # actualiza el hash igual que un tag.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
