# Dependabot: PRs automáticos ante CVEs y updates de dependencias.
# Agrupados por semana para no inundar; security updates salen al toque igual.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (lee pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
    # pnpm 12 rechaza paquetes publicados hace <24 h (guard de supply chain,
    # minimumReleaseAge). El cooldown hace que Dependabot solo proponga
    # versiones con al menos 2 días de maduración — sin PRs rojos por eso.
    cooldown:
      default-days: 2
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # Majors que se encaran a mano y en conjunto (vite+vitest+plugin van
      # juntos; @types/node sigue al Node de los Dockerfiles):
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      # Sus paquetes satélite exigen el mismo major que vitest: solos no sirven.
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]
      # TypeScript 7 (el compilador nuevo) depende de que typescript-eslint y
      # el plugin de hooks lo soporten.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # El panel ya está en ESLint 10, pero la tienda sigue en 9 hasta que
      # eslint-plugin-react (lo trae eslint-config-next) soporte la API del 10.
      # Dependabot no deja ignorar por paquete del workspace (hay una sola
      # entrada para la raíz), así que el ignore es para los dos: el próximo
      # major del panel también va a mano.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # Microsoft.AspNetCore.OpenApi 10 exige Microsoft.OpenApi < 3.0: el 3.x
      # llega con .NET 11.
      - dependency-name: Microsoft.OpenApi
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /storefront
    schedule:
      interval: weekly
    ignore:
      # El salto de major de Node se hace a mano y junto con .node-version
      # (CI y desarrollo): si no, producción corre una versión que nadie probó.
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /admin
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  # Caddy del proxy de borde (infra/edge): el builder y la imagen final llevan
  # el mismo tag, Dependabot los sube juntos en el mismo PR.
  - package-ecosystem: docker
    directory: /infra/edge
    schedule:
      interval: weekly

  # Imágenes de terceros de los compose (Postgres, rclone, MinIO). Las nuestras
  # van con ${REGISTRY}/${TAG} y las fija deploy.sh, no Dependabot.
  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
    ignore:
      # El salto de major de Postgres necesita infra/pg-upgrade.sh (dump y
      # restore), y CI tiene que subir junto (servicio postgres de los workflows).
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      # La imagen de pgAdmin de dev se construye local (infra/docker/pgadmin):
      # no está en ningún registry.
      - dependency-name: tiendafy-pgadmin
