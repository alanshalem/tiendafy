<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP (defensa-en-profundidad). HSTS/X-Frame-Options/nosniff los pone el
         proxy/host estático — ver admin/public/_headers y despliegue.md.
         frame-src: el editor de diseño embebe la tienda del merchant (preview).
         Dev = subdominios *.localhost:3000; prod = la tienda en https (incluye
         dominios propios del merchant). frame-ancestors NO va acá (ignorado en
         <meta>); protege al admin de ser embebido y vive en _headers/proxy. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http://localhost:*; frame-src 'self' http://*.localhost:* https:; object-src 'none'; base-uri 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tiendafy Admin</title>
    <!-- Config de runtime: script clásico, corre durante el parseo y por lo
         tanto ANTES del bundle (que es un módulo y va diferido). El contenedor
         reescribe este archivo al arrancar: por eso la misma imagen sirve para
         staging y para producción. -->
    <script src="/config.js"></script>
    <!-- Las fuentes elegibles del editor de diseño NO van acá: las agrega el
         selector de tipografía al abrirse (lib/useEditorFonts.ts). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
