name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'storefront/**'
      - 'admin/**'
      - 'shared/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'storefront/**'
      - 'admin/**'
      - 'shared/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Type-check (shared + apps)
        run: pnpm -r run type-check

      - name: Lint admin
        run: pnpm --filter ./admin run lint

      - name: Lint storefront
        run: pnpm --filter ./storefront run lint

      - name: Unit tests + coverage (admin)
        run: pnpm --filter ./admin exec vitest run --coverage

      - name: Unit tests + coverage (storefront)
        run: pnpm --filter ./storefront exec vitest run --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            admin/coverage/lcov.info
            storefront/coverage/lcov.info
          retention-days: 7
