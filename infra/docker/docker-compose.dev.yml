name: tiendafy

services:
  postgres:
    # Misma major que prod y CI (paridad dev/prod).
    image: postgres:16-alpine
    container_name: tiendafy-postgres
    environment:
      POSTGRES_USER: tiendafy
      POSTGRES_PASSWORD: tiendafy
      POSTGRES_DB: tiendafy
    ports:
      # Bind solo a loopback: la DB no queda expuesta a la red si el host no es local.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiendafy']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis, RabbitMQ y PgBouncer se removieron: el sistema usa polling a
  # Postgres (webhook inbox, workers) y la API conecta directo al 5432 —
  # ningún código los consumía. PgBouncer queda reservado en el ADR 0003
  # para RLS/multi-réplica; si hace falta, volver a sumarlo acá y a los docs.

  minio:
    image: minio/minio:latest
    container_name: tiendafy-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:9000:9000' # S3 API
      - '127.0.0.1:9001:9001' # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

# Nota: sin dnsmasq — *.localhost resuelve a 127.0.0.1 nativamente en
# browsers modernos y Windows 11. mitienda.localhost:3000 funciona directo.

volumes:
  postgres_data:
  minio_data:
