server {
  listen 8080;          # nginx-unprivileged (no-root) usa 8080
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión: el bundle JS/CSS del admin baja ~70% en la primera carga.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Headers de seguridad (#31). HSTS asume TLS terminado en el proxy de borde.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # SPA: cualquier ruta cae a index.html (React Router resuelve del lado cliente).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets con hash: cache largo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
