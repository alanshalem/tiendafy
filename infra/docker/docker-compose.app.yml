# Overlay full-docker: agrega las 3 apps (API + storefront + admin) EN CONTENEDORES.
# La infra (Postgres/MinIO) viene del compose.dev — este archivo
# NO la redefine (DRY). Se levanta mergeando ambos:
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.app.yml up -d --build
#
# o simplemente: ../../dev-up.ps1 -Docker
#
# Pensado para correr TODO el sistema local en Docker (demo / smoke / onboarding),
# no para el día a día de desarrollo (para eso está dev-up.ps1 nativo, con hot-reload).
name: tiendafy

services:
  api:
    build:
      context: ../.. # contexto = raíz del repo (los Dockerfiles copian shared/, lockfile, etc.)
      dockerfile: backend/Dockerfile
    container_name: tiendafy-api
    environment:
      # Development: cookies no forzadas Secure (funciona sobre http://localhost) y CORS de dev.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Postgres por nombre de servicio (red de compose), no localhost.
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=tiendafy;Username=tiendafy;Password=tiendafy'
      Tenancy__PlatformBaseDomain: localhost
      # MinIO: Endpoint interno (red docker) distinto de la URL pública (browser).
      Media__Endpoint: 'http://minio:9000'
      Media__PublicBaseUrl: 'http://localhost:9000'
      Media__AccessKey: minioadmin
      Media__SecretKey: minioadmin
      # La API corre migraciones idempotentes en el arranque.
      Database__MigrateOnStartup: 'true'
    ports:
      - '127.0.0.1:5080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  storefront:
    build:
      context: ../..
      dockerfile: storefront/Dockerfile
      args:
        # Se hornean en el bundle del navegador (client-side: carrito, favoritos, auth).
        NEXT_PUBLIC_API_URL: 'http://localhost:5080'
        NEXT_PUBLIC_ADMIN_ORIGIN: 'http://localhost:3001'
    container_name: tiendafy-storefront
    environment:
      # SSR (server components) pega a la API por nombre de servicio dentro de la red docker.
      API_URL: 'http://api:8080'
      PLATFORM_BASE_DOMAIN: localhost
      # El dominio pelado es la tienda de la empresa, no un catálogo de tiendas.
      PRIMARY_STORE_SUBDOMAIN: ${PRIMARY_STORE_SUBDOMAIN:-puenteoriente}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: admin/Dockerfile
      args:
        # Vite hornea VITE_API_URL en el build estático → debe ser alcanzable desde el browser.
        VITE_API_URL: 'http://localhost:5080'
    container_name: tiendafy-admin
    ports:
      - '127.0.0.1:3001:8080'
    depends_on:
      - api
    restart: unless-stopped
