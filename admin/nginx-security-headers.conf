# Headers de seguridad (#31). HSTS asume TLS terminado en el proxy de borde.
#
# Se incluye en CADA location y no una vez en el server: en nginx, un
# add_header dentro de una location borra todos los add_header heredados del
# server. Así /assets/ y /config.js (que suman su Cache-Control) se servían
# sin HSTS, nosniff ni X-Frame-Options.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# CSP por header (el <meta> de index.html no puede llevar frame-ancestors). Es lo
# mismo que el meta, con frame-ancestors 'none': el panel no se embebe en nadie.
# connect-src queda en 'self' https: acá; docker-config.sh agrega al arrancar
# otra política que lo acota a la API y a Sentry de ESTE ambiente. Con dos
# Content-Security-Policy el navegador aplica ambas (gana lo más estricto).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
# Generado al arrancar (tmpfs). Con comodín para que falte sin romper nginx.
include /tmp/tiendafy/csp-connect*.conf;