# Proxy de borde (sample). Rate limiting a nivel proxy: necesario cuando el backend
# corre en VARIAS réplicas (el AddRateLimiter de la app es por-instancia).
#
# Zonas de rate limit (memoria compartida entre workers, clave = IP del cliente).
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m   rate=1r/s;   # login/registro/reset

upstream tiendafy_api    { server api:8080; }
upstream tiendafy_store  { server storefront:3000; }
upstream tiendafy_admin  { server admin:8080; }

server {
  listen 443 ssl http2;
  server_name api.tudominio.com;

  # ssl_certificate ...; ssl_certificate_key ...;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Endpoints sensibles: límite agresivo (burst chico, sin nodelay = encola).
  location ~ ^/api/v1/(auth/(login|register|forgot|reset)|shop/auth/(login|register|forgot|reset)|contact/submit) {
    limit_req zone=api_auth burst=5;
    proxy_pass http://tiendafy_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Resto de la API: límite general.
  location /api/ {
    limit_req zone=api_general burst=40 nodelay;
    proxy_pass http://tiendafy_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Storefront: dominio de plataforma + *.subdominios (tiendas).
server {
  listen 443 ssl http2;
  server_name tudominio.com *.tudominio.com;
  location / {
    proxy_pass http://tiendafy_store;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Admin (estático servido por su propio nginx con los headers de seguridad).
server {
  listen 443 ssl http2;
  server_name admin.tudominio.com;
  location / {
    proxy_pass http://tiendafy_admin;
    proxy_set_header Host $host;
  }
}

# Redirect HTTP → HTTPS.
server {
  listen 80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}
