name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'storefront/**'
      - 'admin/**'
      - 'shared/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'storefront/**'
      - 'admin/**'
      - 'shared/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Por ahora solo los paquetes shared tienen src + tsconfig.
      # Ampliar a -r (todo el workspace) cuando storefront/admin estén scaffoldeados.
      - name: Type-check shared packages
        run: pnpm --filter "./shared/**" run type-check

      # Activar cuando las apps tengan src/:
      # - name: Build storefront
      #   run: pnpm --filter tiendafy-storefront build
      # - name: Build admin
      #   run: pnpm --filter tiendafy-admin build
      # - name: Lint
      #   run: pnpm -r lint
