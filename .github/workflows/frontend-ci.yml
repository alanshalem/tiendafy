name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'storefront/**'
      - 'admin/**'
      - 'shared/**'
      - 'e2e/**'
      - 'package.json'
      - '.prettierrc'
      - '.prettierignore'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'storefront/**'
      - 'admin/**'
      - 'shared/**'
      - 'e2e/**'
      - 'package.json'
      - '.prettierrc'
      - '.prettierignore'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Type-check (shared + apps)
        run: pnpm -r run type-check

      - name: Lint admin
        run: pnpm --filter ./admin run lint

      - name: Lint storefront
        run: pnpm --filter ./storefront run lint

      # Build de producción en el PR: type-check no ve violaciones de frontera
      # RSC ni fallos de bundling, y hasta ahora el único build real corría en
      # docker-release, DESPUÉS del merge.
      - name: Build storefront (producción)
        run: pnpm --filter ./storefront run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5080

      - name: Build admin (producción)
        run: pnpm --filter ./admin run build

      - name: Unit tests + coverage (admin)
        run: pnpm --filter ./admin exec vitest run --coverage

      - name: Unit tests + coverage (storefront)
        run: pnpm --filter ./storefront exec vitest run --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: |
            admin/coverage/lcov.info
            storefront/coverage/lcov.info
          retention-days: 7
