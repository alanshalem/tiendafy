# ============================================================
# Tiendafy — el BORDE: un solo Caddy para todos los ambientes de la máquina.
#
# Es el único que se queda con los puertos 80 y 443, así que los stacks de
# producción y de staging (y cualquier otra app del servidor) entran por acá y
# se distinguen por dominio. Dos Caddys no pueden convivir: el segundo no
# arranca y el error no dice por qué.
#
#   docker network create tiendafy-edge      # una sola vez
#   docker compose -f docker-compose.edge.yml --env-file .env.edge up -d
#
# Se levanta ANTES que los stacks y no se toca en cada deploy: los deploys
# cambian contenedores de aplicación, no el borde.
# ============================================================

name: tiendafy-edge

networks:
  edge:
    external: true
    name: tiendafy-edge

services:
  caddy:
    build:
      context: ../caddy
    image: tiendafy-caddy:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      - '80:80'
      - '443:443'
    networks:
      - edge
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?definir en .env.edge}
      # Dominio de staging. Va aparte y no se deduce del de producción: el día
      # que staging viva en otro dominio, esto no cambia de forma.
      STAGING_DOMAIN: ${STAGING_DOMAIN:?definir en .env.edge}
      ACME_EMAIL: ${ACME_EMAIL:?definir en .env.edge}
      # Token de Cloudflare con permiso DNS:Edit sobre la zona. Con esto los
      # certificados comodín (*.dominio) salen por DNS-01 y no hace falta que
      # cada tienda nueva espere una emisión al primer visitante — que además
      # choca contra el límite semanal de Let's Encrypt cuando hay muchas.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?definir en .env.edge}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  caddydata:
  caddyconfig:
